name: ERP System CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # TESTS
  # ==========================================
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgres://erp_user:test_password@localhost:5432/erp_test
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: python manage.py migrate

      - name: Run tests
        env:
          DATABASE_URL: postgres://erp_user:test_password@localhost:5432/erp_test
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: python manage.py test --verbosity=2

      - name: Check for missing migrations
        env:
          DATABASE_URL: postgres://erp_user:test_password@localhost:5432/erp_test
          SECRET_KEY: test-secret-key
        run: python manage.py makemigrations --check --dry-run

  # ==========================================
  # BUILD & PUSH DOCKER IMAGE
  # ==========================================
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ==========================================
  # DEPLOY TO TESTING (develop branch)
  # ==========================================
  deploy-testing:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: testing

    steps:
      - name: Deploy to testing server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/erp
            docker compose pull app-testing
            docker compose up -d app-testing
            docker compose exec -T app-testing python manage.py migrate
            docker compose exec -T app-testing python manage.py collectstatic --noinput
            echo "Testing deployment complete"

  # ==========================================
  # DEPLOY TO PRODUCTION (main branch)
  # ==========================================
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/erp

            # Backup database before deploy
            docker compose --profile backup run --rm db-backup

            # Pull and deploy
            docker compose pull app-production celery-worker celery-beat
            docker compose up -d app-production celery-worker celery-beat
            docker compose exec -T app-production python manage.py migrate
            docker compose exec -T app-production python manage.py collectstatic --noinput

            # Restart nginx to pick up any changes
            docker compose restart nginx

            echo "Production deployment complete"
