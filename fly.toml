# Fly.io deployment configuration
# Deploy: fly launch && fly deploy

app = "erp-system"
primary_region = "scl"  # Santiago, Chile (closest to Peru)

[build]
  dockerfile = "Dockerfile"
  target = "production"

[env]
  DJANGO_SETTINGS_MODULE = "erp_system.settings_production"
  PORT = "8000"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health/"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
