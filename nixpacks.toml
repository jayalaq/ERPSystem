[phases.setup]
nixPkgs = ["...", "postgresql"]

[phases.build]
cmds = [
    "pip install -r requirements.txt",
    "python manage.py collectstatic --noinput 2>/dev/null || true"
]

[start]
cmd = "python manage.py migrate && gunicorn erp_system.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 2"
