{% extends "base/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header"><h4>{{ title }}</h4></div>
<div class="card stat-card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                {% for field in form %}
                <div class="col-md-{% if field.name in 'title,description' %}12{% elif field.name == 'customer' %}6{% else %}3{% endif %}">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
                <a href="{% url 'crm:opportunity_list' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
