{% extends "base/base.html" %}
{% block title %}Abrir Caja{% endblock %}
{% block content %}
<div class="row justify-content-center" style="min-height:70vh;align-items:center;">
    <div class="col-md-5 col-lg-4">
        <div class="stat-card position-relative" style="overflow:hidden;">
            <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));"></div>
            <div class="card-body text-center py-5 px-4">
                <div style="width:72px;height:72px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;box-shadow:0 0 30px rgba(99,102,241,0.3);">
                    <i class="bi bi-display" style="font-size:1.8rem;color:#fff;"></i>
                </div>
                <h4 style="font-weight:800;color:#fff;margin-bottom:0.25rem;">Abrir Sesi&oacute;n de Caja</h4>
                <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1.5rem;">Seleccione la caja e ingrese el monto inicial para comenzar</p>
                <form method="post" class="text-start">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Caja Registradora</label>
                        <select name="register" class="form-select" required>
                            {% for reg in registers %}
                            <option value="{{ reg.pk }}">{{ reg.name }} ({{ reg.branch.name }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Monto de Apertura (S/)</label>
                        <input type="number" name="opening_amount" class="form-control" step="0.01" value="0" required
                               style="font-family:'JetBrains Mono',monospace;font-size:1.1rem;text-align:center;font-weight:600;">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100" style="height:48px;font-weight:700;border-radius:12px;">
                        <i class="bi bi-unlock me-2"></i> Abrir Caja
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
